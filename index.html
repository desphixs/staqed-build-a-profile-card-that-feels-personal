<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<!-- The main card container -->
<main class="profile-card">
  <!-- Profile Avatar -->
  <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400&h=400" alt="Smiling woman portrait" class="avatar">

  <!-- User Identity -->
  <h1 class="user-name">Sarah Jenkins</h1>
  <p class="job-title">UI/UX Designer</p>

  <!-- Short Biography -->
  <p class="bio">
    Passionate about creating clean, accessible, and user-friendly web experiences. Dog lover, coffee enthusiast, and
    weekend hiker.
  </p>

  <!-- Social Media Links -->
  <nav class="social-links">
    <a href="#" class="link-btn">LinkedIn</a>
    <a href="#" class="link-btn">GitHub</a>
  </nav>

</main>
</body>

</html>
